# Only cutoff frequencies are specified in the supplied paper Methods.
preprocessing:
  freq_min: 300
  freq_max: 6000
  dtype: float32
  margin_ms: auto
  filter_order: 5
  ftype: butter
  filter_mode: sos
  direction: forward-backward
  add_reflect_padding: false
reader:
  all_annotations: true
diagnostics:
  plot_duration_sec: 0.1
  context_check_sec: 0.1
  chunk_comparison_atol_uV: 0.05
